name: Publicar livro
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.11.9'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar dependências editoriais
        run: pip install -r requirements-editoriais.txt
      - name: Gerar o livro, o artigo e os documentos Word
        run: python ferramentas/gerar.py
      - name: Preparar o visualizador
        run: python ferramentas/preparar_visualizador.py
      - name: Reunir os produtos públicos
        run: python ferramentas/preparar_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site_publico
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
