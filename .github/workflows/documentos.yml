name: Gerar Word e livro
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  documentos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.11.9'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preparar exportação editorial
        run: pip install -r requirements-editoriais.txt
      - name: Gerar e conferir os quatro produtos
        run: python ferramentas/gerar.py
      - uses: actions/upload-artifact@v4
        with:
          name: Dissertacao-Word
          path: _book/word/Dissertacao_Congonhas.docx
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Artigo-Word
          path: artigo/_book/word/Artigo_CMAS_Congonhas.docx
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Livro-HTML
          path: _book/html/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Artigo-HTML
          path: artigo/_book/html/
          if-no-files-found: error
      - name: Preparar o visualizador sem conexão
        run: python ferramentas/preparar_visualizador.py
      - uses: actions/upload-artifact@v4
        with:
          name: Visualizador-offline
          path: _visualizador/
          retention-days: 30
          if-no-files-found: error

