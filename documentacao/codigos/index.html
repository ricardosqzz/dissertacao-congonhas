<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Códigos e cálculos</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6f8;color:#183646;font:16px/1.6 Arial,sans-serif}header{background:#14384b;color:white;padding:38px max(24px,calc((100vw - 1300px)/2));}main{max-width:1350px;margin:auto;padding:26px}h1{font-size:32px;line-height:1.2;margin:0 0 14px}h2{font-size:23px}a{color:#126987}header a{color:white}nav{display:flex;flex-wrap:wrap;gap:12px}nav a,button{background:white;color:#173c50;border:1px solid #b6cbd4;padding:9px 16px;border-radius:7px;text-decoration:none;cursor:pointer}section,article{background:white;border:1px solid #dbe5e9;border-radius:12px;padding:22px;margin:20px 0}img{max-width:100%;height:auto}select,input{padding:12px;border:1px solid #a8c1cc;border-radius:6px;font-size:16px;max-width:100%}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}.muted{color:#5a707c}table{width:100%;border-collapse:collapse}td,th{text-align:left;vertical-align:top;padding:10px;border-bottom:1px solid #d9e3e8}th{background:#edf3f6}pre{white-space:pre;overflow:auto;padding:18px;background:#112e3e;color:#e7f1f6;border-radius:7px;font:13px/1.6 Consolas,monospace}.pill{display:inline-block;border-radius:4px;background:#eaf2f6;padding:4px 9px;font-size:13px}details{margin:14px 0}iframe{width:100%;height:76vh;border:1px solid #bdd0d8}footer{max-width:1300px;margin:25px auto;padding:20px;color:#587381}@media(max-width:700px){main{padding:12px}header{padding:24px}h1{font-size:25px}td,th{font-size:13px;padding:7px}}</style><header><h1>Códigos e cálculos</h1><p>Entradas, campos, bibliotecas, funções e produtos da versão corrente.</p><nav><a href="../../visualizador/">Projeto e mapas</a><a href="https://github.com/ricardosqzz/dissertacao-congonhas">Repositório</a><a href="guia-completo.html">Guia integral (179 rotinas)</a><a href="../poster/">Pôster explicado e roteiro</a></nav></header><main><section><label>Buscar código ou método <input id="busca" placeholder="k-means, Moran, leitura..."></label> <select id="lista" aria-label="Código"></select><p id="contador"></p></section><article id="conteudo"></article></main><script>
let catalog=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function table(headers,rows){return '<table><tr>'+headers.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+esc(x)+'</td>').join('')+'</tr>').join('')+'</table>'}
function show(){const d=catalog.find(x=>x.nome===document.querySelector('#lista').value);if(!d)return;location.hash=d.nome;const inputs=xs=>xs.map(x=>[x.caminho,x.chamada,'linha '+x.linha]);let html='<h2>'+esc(d.nome)+'</h2><span class="pill">'+esc(d.papel)+'</span><p>'+esc(d.finalidade)+'</p><p><a href="https://github.com/ricardosqzz/dissertacao-congonhas/blob/main/'+encodeURI(d.arquivo)+'">Abrir e editar no GitHub</a></p>';
html+='<h3>Entradas</h3>'+table(['Arquivo ou expressão','Leitura','Referência'],inputs(d.entradas));html+='<h3>Saídas</h3>'+table(['Produto ou expressão','Gravação','Referência'],inputs(d.saidas));
for(const [label,obj]of [['Campos e chaves lidos',d.campos_lidos],['Campos e chaves gerados',d.campos_gerados]])html+='<h3>'+label+'</h3>'+table(['Objeto','Campos'],Object.entries(obj).map(([a,b])=>[a,b.join(', ')]));
html+='<p><a href="fichas/'+encodeURIComponent(d.nome.replace(/\.py$/,''))+'.html">Abrir explicação detalhada</a></p><h3>Bibliotecas e módulos</h3><p>'+esc(d.imports.join(', '))+'</p><h3>Funções</h3>'+table(['Função','Argumentos','Linha'],d.funcoes.map(x=>[x.nome,x.argumentos,x.linha]));html+='<h3>Trechos de cálculo</h3>';for(const x of d.operacoes.filter(x=>!['sum','mean','std'].includes(x.operacao)).slice(0,14))html+='<p><b>'+esc(x.operacao)+'</b> · linha '+x.linha+'</p><pre>'+esc(x.codigo)+'</pre>';
html+='<details><summary>Código integral numerado</summary><pre>'+d.source.split('\n').map((x,i)=>String(i+1).padStart(5,' ')+'  '+esc(x)).join('\n')+'</pre></details>';document.querySelector('#conteudo').innerHTML=html;}
function filter(){const q=document.querySelector('#busca').value.toLowerCase(),items=catalog.filter(x=>(x.nome+' '+x.finalidade+' '+x.imports.join(' ')).toLowerCase().includes(q));document.querySelector('#lista').innerHTML=items.map(x=>'<option>'+esc(x.nome)+'</option>').join('');document.querySelector('#contador').textContent=items.length+' códigos da versão atual';show()}
fetch('catalogo.json').then(r=>r.json()).then(d=>{catalog=d;const requested=location.hash;filter();if(requested){const n=decodeURIComponent(requested.slice(1));if(catalog.some(x=>x.nome===n)){document.querySelector('#lista').value=n;show()}}});document.querySelector('#busca').oninput=filter;document.querySelector('#lista').onchange=show;
</script></html>
